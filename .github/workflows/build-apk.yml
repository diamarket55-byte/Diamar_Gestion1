name: Build DiaMar Gestion FINAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparer Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decompresser le projet
        run: |
          unzip -o DiaMar_Gestion_Android_FINAL.zip
          ls -la DiaMar_Gestion_Android_FINAL

      - name: Corriger les versions Compose
        working-directory: DiaMar_Gestion_Android_FINAL
        run: |
          echo "Correction Compose 1.12.x -> 1.11.4"
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" -o -name "*.properties" \) -print0 | xargs -0 sed -i \
            -e 's/2026\.09\.00/2026.06.01/g' \
            -e 's/1\.12\.1/1.11.4/g'
          echo "Versions après correction:"
          grep -R "2026.06.01\|1.11.4" . --include="*.gradle" --include="*.gradle.kts" --include="*.toml" --include="*.properties" || true

      - name: Construire l APK
        working-directory: DiaMar_Gestion_Android_FINAL
        run: gradle assembleDebug --stacktrace

      - name: Recuperer l APK
        uses: actions/upload-artifact@v4
        with:
          name: DiaMar-Gestion-FINAL-APK
          path: DiaMar_Gestion_Android_FINAL/app/build/outputs/apk/debug/*.apk
