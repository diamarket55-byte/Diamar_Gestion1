name: Build DiaMar Gestion FINAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparer Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decompresser le projet
        run: |
          unzip -o DiaMar_Gestion_Android_FINAL.zip
          ls -la DiaMar_Gestion_Android_FINAL

      - name: Corriger Compose
        working-directory: DiaMar_Gestion_Android_FINAL
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) -exec sed -i 's/1.12.1/1.11.4/g' {} \;
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) -exec sed -i 's/2026.09.00/2026.06.01/g' {} \;
          echo "Compose corrige"

      - name: Corriger JVM Java Kotlin
        working-directory: DiaMar_Gestion_Android_FINAL
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "21"/g' {} \;
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/VERSION_1_8/VERSION_21/g' {} \;
          echo "Java et Kotlin configures en JVM 21"

      - name: Construire APK
        working-directory: DiaMar_Gestion_Android_FINAL
        run: gradle assembleDebug --stacktrace

      - name: Recuperer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DiaMar-Gestion-FINAL-APK
          path: DiaMar_Gestion_Android_FINAL/app/build/outputs/apk/debug/*.apk
