name: Build DiaMar Gestion FINAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Décompresser le projet Android
        run: |
          unzip -o DiaMar_Gestion_Android_FINAL.zip
          echo "Projet décompressé :"
          find DiaMar_Gestion_Android_FINAL -maxdepth 2 -type f | head -30

      - name: Donner les permissions Gradle
        run: chmod +x DiaMar_Gestion_Android_FINAL/gradlew

      - name: Construire l'APK
        working-directory: DiaMar_Gestion_Android_FINAL
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: DiaMar-Gestion-FINAL-APK
          path: DiaMar_Gestion_Android_FINAL/app/build/outputs/apk/debug/*.apk
