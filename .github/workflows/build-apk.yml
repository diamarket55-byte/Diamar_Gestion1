name: Build DiaMar Gestion FINAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparer Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decompresser le projet
        run: |
          unzip -o DiaMar_Gestion_Android_FINAL.zip
          ls -la DiaMar_Gestion_Android_FINAL

      - name: Construire l APK
        working-directory: DiaMar_Gestion_Android_FINAL
        run: gradle assembleDebug --stacktrace

      - name: Recuperer l APK
        uses: actions/upload-artifact@v4
        with:
          name: DiaMar-Gestion-FINAL-APK
          path: DiaMar_Gestion_Android_FINAL/app/build/outputs/apk/debug/*.apk
